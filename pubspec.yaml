name: spark
description: "Spark - a focused Android music player with a Rust audio engine"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Rust bridge. Pinned exactly: rust/Cargo.toml pins
  # flutter_rust_bridge = "=2.12.0" and the generated bindings under lib/src/rust
  # were produced by 2.12.0. The Dart side must match or the bridge fails at
  # runtime -- a caret constraint here silently resolves 2.13.0.
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.0.0
  rust_lib_flick_player:
    path: rust_builder

  # State management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0

  # Persistence
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.1
  path: ^1.9.1

  # Audio
  just_audio: ^0.10.5
  audio_session: ^0.2.2

  # Media / meta
  image: ^4.8.0
  image_picker: ^1.1.2
  flutter_cache_manager: ^3.4.1
  xml: ^6.5.0
  crypto: ^3.0.3
  http: ^1.2.0
  connectivity_plus: ^7.0.0

  # UI
  lucide_icons_flutter: ^3.1.8
  flutter_svg: ^2.2.3
  fl_chart: ^1.1.1
  fading_marquee_widget: ^1.2.0
  skeletonizer: ^2.1.2
  flutter_displaymode: ^0.7.0
  flutter_markdown: ^0.7.7
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  json_annotation: ^4.9.0
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: 6.11.2
  isar_community_generator: ^3.3.2
  riverpod_generator: 4.0.0+1

# Resolve conflict between riverpod_generator and isar_community_generator
# while keeping build_runner compatible with the cached toolchain versions.
# Carried over from Flick, where this exact pin is known to work.
dependency_overrides:
  analyzer: 8.1.1
  dart_style: 3.1.2

flutter:
  uses-material-design: true
  generate: true
